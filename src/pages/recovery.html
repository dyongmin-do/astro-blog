<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>重置密码</title>
    <style>
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f5f5f5;
        color: #333;
      }
      .container {
        text-align: center;
        padding: 2rem;
      }
      h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
      p { color: #666; margin-bottom: 1.5rem; }
      a {
        display: inline-block;
        padding: 0.6rem 1.5rem;
        background: #0070f3;
        color: #fff;
        text-decoration: none;
        border-radius: 5px;
      }
      a:hover { background: #005bb5; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>正在处理密码重置...</h1>
      <p>如果没有弹出重置密码窗口，请稍候。</p>
      <a href="/admin.html">前往管理后台</a>
    </div>
    <script src="https://unpkg.com/netlify-identity-widget@1/dist/netlify-identity-widget.js"></script>
    <script>
      netlifyIdentity.on('close', function() {
        // 用户关闭弹窗后跳转到管理后台
        window.location.href = '/admin.html';
      });
    </script>
  </body>
</html>
